#Cambiar el project key por el nombre_apellido_t1
name: Build

on:
  push:
    branches:
      - main


jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

sonar.tests=.
sonar.test.inclusions=**/tests/**, **test_*.py
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=producer_app.py, consumer_app.py, infrastructure/adapters/rabbitmq_adapter.py, infrastructure/config.py